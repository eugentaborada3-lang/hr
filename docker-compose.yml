# Development Compose stack for Horilla HR.
# Zero-config: `make dev` / `docker compose up --build`
# Production: `make prod` (uses docker-compose.prod.yml + .env — see .env.dist)
#
# Dev secrets below are intentionally weak and for local use only.
# Replaces the legacy docker-compose.yaml (Python 3.10 / runserver) stack.

services:
  web:
    restart: unless-stopped
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - staticfiles:/app/staticfiles
      - media:/app/media
    environment:
      - DEBUG=1
      - DB_HOST=db
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0,172.16.16.111
      - CSRF_TRUSTED_ORIGINS=http://localhost:8000,http://172.16.16.111:8000
      - DATABASE_URL=postgres://horilla_user:horilla_pass@db:5432/horilla_db
      - DB_INIT_PASSWORD=dev-init-password-change-in-production
      - REDIS_URL=redis://:horilla_pass@redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: horilla_db
      POSTGRES_USER: horilla_user
      POSTGRES_PASSWORD: horilla_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U horilla_user -d horilla_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: redis-server --requirepass horilla_pass
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "horilla_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
